<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopHub - E-commerce Store</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f8fafc; color: #1e293b; line-height: 1.6; }
        header { background: #ffffff; padding: 1rem 5%; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #e2e8f0; position: sticky; top: 0; z-index: 100; }
        .logo { font-size: 1.5rem; font-weight: bold; color: #4f46e5; }
        .cart-info { font-weight: 600; color: #4f46e5; background: #e0e7ff; padding: 6px 15px; border-radius: 20px; }
        .container { max-width: 1100px; margin: 3rem auto; padding: 0 20px; }
        h2 { font-size: 1.8rem; margin-bottom: 1.5rem; color: #0f172a; }
        .products-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; }
        .product-card { background: white; border-radius: 10px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.05); border: 1px solid #e2e8f0; padding: 15px; text-align: center; }
        .product-img { height: 140px; background: #e0e7ff; display: flex; align-items: center; justify-content: center; font-weight: bold; color: #4f46e5; border-radius: 8px; margin-bottom: 15px; }
        .product-card h3 { margin-bottom: 5px; font-size: 1.1rem; }
        .price { font-weight: bold; color: #10b981; font-size: 1.1rem; margin-bottom: 10px; display: block; }
        .buy-btn { background: #4f46e5; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; transition: background 0.2s; }
        .buy-btn:hover { background: #4338ca; }
    </style>
</head>
<body>

<header>
    <div class="logo">ShopHub</div>
    <div class="cart-info">Cart: <span id="cartCount">0</span> items</div>
</header>

<div class="container">
    <h2>Featured Products</h2>
    <div class="products-grid">
        <div class="product-card">
            <div class="product-img">Wireless Headphones</div>
            <h3>Wireless Headphones</h3>
            <span class="price">$79.99</span>
            <button class="buy-btn" onclick="addToCart()">Add to Cart</button>
        </div>
        <div class="product-card">
            <div class="product-img">Smart Watch</div>
            <h3>Smart Fitness Watch</h3>
            <span class="price">$129.99</span>
            <button class="buy-btn" onclick="addToCart()">Add to Cart</button>
        </div>
        <div class="product-card">
            <div class="product-img">Running Shoes</div>
            <h3>Pro Running Shoes</h3>
            <span class="price">$89.99</span>
            <button class="buy-btn" onclick="addToCart()">Add to Cart</button>
        </div>
    </div>
</div>

<script>
    let count = 0;
    function addToCart() {
        count++;
        document.getElementById('cartCount').textContent = count;
    }
</script>

</body>
</html>
